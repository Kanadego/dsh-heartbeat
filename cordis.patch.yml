# dsh-heartbeat bundle layer: applied automatically when the package is
# installed into a DSH profile (package.json declares dsh.bundle.patch).
# The profile's own cordis.patch.yml loads after this layer and may override
# these rows by id.
#
# To pin the runtime data dir to a specific location, add an id-targeted
# override in the PROFILE's cordis.patch.yml (user-owned, not shipped here):
#   - id: heartbeat
#     config:
#       dataDir: D:/your/workspace/data
# Default: <packageRoot>/data.
- insert:
    - id: heartbeat
      name: '@kanadego/dsh-heartbeat'

# ── Agent preset heartbeat（0.1.7 声明式预设，v1.7.1）─────────────────
# 0.1.7 起 agentPresets 名册不再挂载文件系统用户根（~/.dsh/.agent-presets），
# 预设改为组合里的 @deepseek-ai/dsh-agent-preset 声明行（与官方 preset-standard
# 同款机制）。内容 = assets/presets/heartbeat/agent.cordis.yml 的移植：
# compaction 组 + 唯一模型工具 tool-web(fetch:false)。
# 刻意没有 persona 行：部署人格（soul card）+ 心跳提示词已够，绝不能让
# "You are a coding agent" 盖掉人格。≤0.1.5 宿主继续走文件系统预设自装。
- insert:
    - id: preset-heartbeat
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: heartbeat
        name: 心跳模式
        description: 心跳 agent 专用：仅 web_search + 上下文折叠；无 shell、无文件、无子代理。
        order: 20
        plugins:
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: false
              searchTimeoutMs: 60000
