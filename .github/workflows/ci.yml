name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    # Windows-only plugin (`os: ["win32"]`) whose vault uses DPAPI, so the test
    # suite can only run on a Windows runner.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # The client half is plain browser JS outside the tsconfig include, so a
      # syntax error there used to reach a release unchecked (低优先级 review).
      - run: npm run check:client
      - run: npm test
      # 低优先级 review (2026-10-17): dist/ is tracked, and CI used to stop at
      # typecheck + test — a release could ship a dist that no longer matches
      # src. Build it and fail if the tracked artifacts move.
      - run: npm run build
      - name: dist matches the sources it was built from
        run: git diff --exit-code -- dist
